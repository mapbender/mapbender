        multiplechoice_help: "Wählen Sie, welche Eigenschaften beim Überfahren von Features auf der Karte als Tooltip angezeigt werden sollen. Wird bei gesetzter Erweiterter Vorlage überschrieben. Kann per Drag & Drop umsortiert werden."
        template: Erweiterte Vorlage (HTML/YAML)
        template_help: |-
          Wenn gesetzt, wird die einfache Attributtabelle überschrieben. Geben Sie entweder HTML ein (verwenden Sie die Syntax <code>${attribute}</code> für Platzhalter) oder ein YAML-Array für eine Attributtabelle, in der die Namen überschrieben werden können.

          Beispiele:

          <br><br><code><b>${name}</b> (id: ${id})</code><br><br>

          <code>- name: Ortsname
          - add: Adresse</code>
