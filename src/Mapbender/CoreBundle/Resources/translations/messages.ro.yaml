        query_url: 'URL interogare'
        query_url.help: 'URL Solr sau Nominatim către care este trimis termenul de căutare (de ex. <code>https://nominatim.openstreetmap.org/search.php?format=geojson</code>).'
        query_key: 'Parametru URL interogare'
        query_key.help: 'Parametrul URL care este completat cu termenul de căutare introdus (de ex. <code>q</code>)'
        query_ws_replace: 'Înlocuire spații goale în interogare'
        query_ws_replace.help: 'Dacă este specificat, spațiile și întreruperile de linie din interogarea de căutare vor fi înlocuite cu această valoare, de ex. <code>+</code> sau <code>%20</code>'
        query_format: 'Format cheie interogare'
        query_format.help: 'Format pentru funcția PHP <a href="https://www.php.net/manual/en/function.sprintf.php" target="_blank">sprintf</a>, cu care este formatat termenul de căutare, de ex. <code>%s</code> (implicit) dacă termenul de căutare trebuie interpretat ca șir de caractere, <code>%d</code> dacă se așteaptă un număr'
        token_regex: 'Tokenizer: Regex de separare'
        token_regex.help: 'Cu ajutorul tokenizer-ului, termenii de căutare pot fi modificați înainte de a fi trimiși către URL-ul de căutare. Regex-ul de separare trebuie să corespundă tuturor caracterelor care marchează începutul unui nou token (de regulă, un cuvânt nou). Implicit: <code> </code> (spațiu)'
        token_regex_in: 'Tokenizer: Regex de căutare'
        token_regex_in.help: 'În interiorul fiecărui token (vezi Regex de separare) se caută această expresie regulată, care este apoi înlocuită cu valoarea din „Regex de înlocuire”.'
        token_regex_out: 'Tokenizer: Regex de înlocuire'
        token_regex_out.help: 'În interiorul fiecărui token (vezi Regex de separare) expresia regulată din „Regex de căutare” este înlocuită cu această valoare. Grupurile găsite sunt referențiate prin numerotare precedată de <code>$</code>. De exemplu, <code>$1*</code> ar adăuga un asterisc la fiecare cuvânt căutat.'
        collection_path: 'Cale către rezultate'
        collection_path.help: 'Calea către lista de rezultate din răspunsul URL-ului de căutare. Fiecare nivel ierarhic este separat printr-un punct, de ex. <code>response.docs</code> (standard Solr), <code>features</code> (GeoJSON)'
        label_attribute: 'Atribut pentru etichetă'
        label_attribute.help: 'Calea (în cadrul unui singur rezultat) către atributul care va fi afișat ca etichetă, de ex. <code>label</code>. Alternativ, poate fi specificat un șablon de tip șir de caractere, de ex. <code>Oraș ${properties.address.city} - ${properties.address.road}</code>'
        geom_attribute: 'Atribut pentru geometrie'
        geom_attribute.help: 'Calea (în cadrul unui singur rezultat) către atributul în care este disponibilă geometria, de ex. <code>geom</code>, <code>geometry</code> (GeoJSON)'
        geom_format: 'Format geometrie'
        geom_format.help: 'Formatul în care este disponibilă geometria, fie <a href="https://en.wikipedia.org/wiki/Well-known_text_representation_of_geometry" target="_blank">Well Known Text</a>, fie <a href="https://geojson.org/" target="_blank">GeoJSON</a>'
        sourceSrs: 'SRS sursă'
        sourceSrs.help: '<a href="https://epsg.io/" target="_blank">Codul EPSG</a> al proiecției utilizate în URL-ul de căutare, inclusiv prefixul <code>EPSG:</code>, de ex. <code>EPSG:25832</code>. Dacă nu este specificat, se presupune că rezultatele sunt în proiecția implicită a hărții.'
        delay: 'Întârziere căutare [ms]'
        delay.help: 'Timpul în milisecunde care trece de la ultima tastă apăsată până la executarea automată a căutării. Implicit: 300 ms'
        result_buffer: 'Zonă tampon rezultat [unități hartă]'
        result_buffer.help: 'Determină indirect nivelul de zoom care apare după selectarea unui rezultat. În jurul geometriei este vizibilă cel puțin zona selectată. Unitatea de măsură variază în funcție de proiecție, de regulă fiind metri. O combinație cu scara (min/max) este posibilă, dar poate duce la rezultate nedorite.'
        result_minscale: 'Scară minimă [numitor]'
        result_minscale.help: 'Alternativă la specificarea nivelului de zoom. În funcție de dimensiunea geometriei țintă, se stabilește o scară între <code>min</code> și <code>max</code>. Pentru o scară de <code>1 : 1000</code> este suficient să introduceți <code>1000</code>. Pentru o scară fixă, este suficientă introducerea scării minime.'
        result_maxscale: 'Scară maximă [numitor]'
        result_icon_url: 'URL pictogramă'
        result_icon_url.help: 'URL către un fișier imagine utilizat ca marker pentru geometriile de tip punct. Poate fi relativ sau absolut. Pinul implicit se află la <code>/bundles/mapbendercore/image/pin_red.png</code>.'
        result_icon_offset: 'Decalaj pictogramă'
        result_icon_offset.help: 'Corecția poziției pictogramei, ca decalaj x și y separat prin virgulă, de ex. <code>-6,-32</code> pentru pinul implicit'
